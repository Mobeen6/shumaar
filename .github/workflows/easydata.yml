name: Fetch SBP EasyData
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/schools_probe.py', 'tools/kibor_probe.py', 'tools/easydata_fetch.py', 'tools/easydata_series.json', '.github/workflows/easydata.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/schools_probe.py
      - run: python tools/kibor_probe.py
      - run: python tools/easydata_fetch.py
        env:
          SBP_EASYDATA_KEY: ${{ secrets.SBP_EASYDATA_KEY }}
      - run: 'bash tools/commit.sh "EasyData: update"'
