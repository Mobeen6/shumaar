name: Probe sources
on:
  push:
    paths: ['tools/probe.py', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe.py
      - run: |
          git config user.name "shumaar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_raw/probe
          git diff --cached --quiet || (git commit -m "Probe: source check" && git pull --rebase && git push)
