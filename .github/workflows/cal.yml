name: Fetch release calendars
on:
  schedule:
    - cron: '30 3 * * *'   # daily, 08:30 PKT
  workflow_dispatch:
  push:
    paths: ['tools/cal_fetch.py', 'tools/cal_parse.py', '.github/workflows/cal.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas openpyxl xlrd pdfplumber pdfplumber beautifulsoup4
      - run: python tools/cal_fetch.py
      - run: if [ -f tools/cal_parse.py ]; then python tools/cal_parse.py; fi
      - run: bash tools/commit.sh "Calendar: daily update"
