name: Fetch PBS SPI
on:
  schedule:
    - cron: '0 6,18 * * 5,6'   # Fri and Sat, 11:00 and 23:00 PKT
  workflow_dispatch:
  push:
    paths: ['tools/spi_fetch.py', 'tools/spi_parse.py', '.github/workflows/spi.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas openpyxl xlrd pdfplumber pdfplumber openpyxl
      - run: python tools/spi_fetch.py ${{ github.event_name == 'schedule' && 3 || 60 }}
      - run: if [ -f tools/spi_parse.py ]; then python tools/spi_parse.py; fi
      - run: 'bash tools/commit.sh "SPI: weekly PBS update"'
