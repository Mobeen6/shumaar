name: Fetch PBS SPI
on:
  schedule:
    - cron: '0 6,18 * * 5,6'   # Fri and Sat, 11:00 and 23:00 PKT
  workflow_dispatch:
  push:
    paths: ['tools/spi_fetch.py', 'tools/spi_parse.py', '.github/workflows/spi.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pdfplumber
      - run: python tools/spi_fetch.py 8
      - run: if [ -f tools/spi_parse.py ]; then python tools/spi_parse.py; fi
      - run: |
          git config user.name "shumaar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_raw spi.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "SPI: weekly PBS update" && git push)
